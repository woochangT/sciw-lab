<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>수업 현황 · 서술 실험실</title><link rel="stylesheet" href="teacher/style.css"></head><body>
<header><div><a id="backToStart" class="back" href="index.html">← 시작 화면으로</a><span class="eyebrow">서술 실험실 / 교사용</span><h1>수업 현황과 분석</h1><p>수업 중 진행을 살피고, 같은 기록으로 수업을 돌아보세요.</p></div><span class="badge">20초마다 다시 조회</span></header>
<main><section class="controls"><label>데이터 <select id="source"><option value="demo">예시 데이터</option><option value="local">이 브라우저의 로컬 기록</option><option value="remote">서버 기록 (설정 필요)</option></select></label><label>반 코드 <input id="classCode" value="DEMO" autocomplete="off"></label><label id="lessonLabel">수업 ID <input id="lessonId" value="DEMO" maxlength="64" autocomplete="off" placeholder="비우면 기존 기록"></label><label>미션 <select id="mission"><option value="m01">01 감자 삼투</option><option value="m02">02 강철솜 질량 보존</option></select></label><label id="keyLabel" hidden>교사 접근 키 <input id="teacherKey" type="password" autocomplete="off"></label><button id="refresh">지금 새로고침</button><p id="status" role="status"></p></section>
<div class="notice" id="notice">현재 <strong>가상의 예시 데이터</strong>를 보고 있습니다. 실제 학생 기록이 아닙니다. 로컬 기록은 이 브라우저에만 저장됩니다. 서버 기록은 교사 인증과 반·미션별 권한이 필요합니다. 운영 인증을 검증하기 전에는 실제 학생 데이터를 사용하지 마세요.</div>
