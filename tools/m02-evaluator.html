<!doctype html>
<html lang="ko">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>미션 02 · AI 판정 실험</title>
<style>
  *{box-sizing:border-box}body{margin:0;background:#f4f2ec;color:#25382f;font:16px/1.65 system-ui,sans-serif}main{max-width:980px;margin:40px auto;padding:0 24px}h1{font-size:28px;margin-bottom:8px}small,.muted{color:#667469}.panel{background:white;border:1px solid #d8dfd7;border-radius:14px;padding:24px;margin:20px 0}label{display:block;font-weight:650;margin-top:14px}select,textarea,button{font:inherit}textarea,select{width:100%;padding:10px;border:1px solid #aebbaf;border-radius:7px}textarea{min-height:140px;resize:vertical}#initial{min-height:75px}button{background:#28533e;color:white;border:0;border-radius:8px;padding:10px 20px;margin-top:16px;cursor:pointer}button:disabled{opacity:.5;cursor:wait}table{border-collapse:collapse;width:100%;font-size:14px}td,th{text-align:left;border-bottom:1px solid #dde3dd;padding:8px;vertical-align:top}blockquote{margin:12px 0;padding-left:14px;border-left:3px solid #d4b341;white-space:pre-wrap}.answer{white-space:pre-wrap}mark{background:#ffe79b}#status{font-weight:650}pre{overflow:auto;max-height:400px;font-size:12px}a{color:#28533e}
</style>
<main>
  <small>서술 실험실 · 개발용 로컬 화면</small>
  <h1>루브릭으로 답안을 읽어 보기</h1>
  <p class="muted">게임을 처음부터 반복하지 않고 단계별 답을 비교하는 화면이에요. 제출할 때만 OpenAI를 호출하며 운영 시트에 기록하지 않아요.</p>
  <p id="connection" role="status">로컬 서버 확인 중…</p>
  <form class="panel" id="form">
    <label for="stage">평가 단계</label>
    <select id="stage"><option value="first">처음 생각 · 진단만</option><option value="Q1">Q1 · 전체 질량의 불변</option><option value="Q2" selected>Q2 · 산소의 출처</option><option value="Q3">Q3 · 증가분의 의미</option><option value="final">최종 변론</option></select>
    <p id="question"></p>
    <label for="answer">평가할 답안</label><textarea id="answer" maxlength="200" required>그 산소는 공기 중에 있었다.</textarea>
    <div id="initialWrap" hidden><label for="initial">처음 생각 · 새 연결 비교용</label><textarea id="initial" maxlength="400">열이 더해져 무거워졌다고 생각한다.</textarea></div>
    <button id="submit">AI로 읽기</button>
    <p id="status" role="status" aria-live="polite"></p>
  </form>
  <section class="panel" id="result" hidden><h2 id="outcome"></h2><p id="next"></p><p id="summary" class="muted"></p>
    <table><thead><tr><th>요소</th><th>판정</th><th>원문과 이유</th></tr></thead><tbody id="checks"></tbody></table>
    <div id="errors"></div><h3>답안과 좋은 연결</h3><p id="marked" class="answer"></p><div id="praise"></div>
    <details><summary>상세 JSON</summary><pre id="json"></pre></details>
  </section>
  <p><a href="/강철솜%20질량%20보존/web/">실제 게임에서 플레이하기 →</a></p>
</main>
<script src="/강철솜%20질량%20보존/web/js/rubric02.js"></script>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
const R = window.SCIW_RUBRIC02;
const labels = { pass: '통과', revise: '보완 필요', clarify: '뜻 확인 필요', diagnostic: '초기 진단 · 다음 단계 진행' };
const states = { met: '충족', partial: '부분 충족', missing: '미충족', uncertain: '모호함' };
function setup() {
  const stage = $('stage').value;
  $('question').textContent = R.STAGES[stage].question;
  $('initialWrap').hidden = stage !== 'final';
  $('answer').maxLength = stage === 'final' ? 1500 : stage === 'first' ? 400 : 200;
}
$('stage').addEventListener('change', setup); setup();
fetch('/api/m02/status').then((res) => res.json()).then((s) => { $('connection').textContent = (s.hasKey ? '키 설정됨' : '키 미설정') + ' · ' + s.model + ' · ' + s.rubricVersion; }).catch(() => { $('connection').textContent = 'tools/m02-local-server.cjs로 실행한 로컬 서버에서 열어 주세요.'; });
function paragraph(parent, text) { const p = document.createElement('p'); p.textContent = text; parent.append(p); }
function show(text, r) {
  $('result').hidden = false; $('outcome').textContent = labels[r.outcome]; $('next').textContent = r.nextQuestion;
  $('summary').textContent = '설명 시도 ' + Number(r.analysis.explanationAttempt) + ' · 연결 수준 ' + (r.analysis.explanationAttempt ? r.analysis.explanationQuality : '해당 없음') + (r.path ? ' · 경로 ' + r.path : '');
  $('checks').replaceChildren();
  for (const [key, c] of Object.entries(r.analysis.checks)) {
    const row = document.createElement('tr');
    for (const value of [key, states[c.status], (c.quote ? '“' + c.quote + '” — ' : '') + c.reason]) { const td = document.createElement('td'); td.textContent = value; row.append(td); }
    $('checks').append(row);
  }
  $('errors').replaceChildren();
  for (const e of r.analysis.errors) paragraph($('errors'), e.code + ' · “' + e.quote + '” — ' + e.reason);
  $('marked').replaceChildren();
  const cuts = [...new Set([0, text.length, ...r.highlights.flatMap((h) => [h.start, h.end])])].sort((a, b) => a - b);
  cuts.slice(0, -1).forEach((start, i) => {
    const end = cuts[i + 1]; const active = r.highlights.filter((h) => h.start < end && h.end > start);
    if (active.length) { const mark = document.createElement('mark'); mark.textContent = text.slice(start, end); mark.title = active.flatMap((h) => h.roles).join(', '); $('marked').append(mark); }
    else $('marked').append(document.createTextNode(text.slice(start, end)));
  });
  $('praise').replaceChildren();
  for (const h of r.highlights) paragraph($('praise'), '“' + h.quote + '” — ' + h.explanation + (h.isNew ? ' 처음 생각보다 새롭게 드러난 연결이에요.' : ''));
  $('json').textContent = JSON.stringify(r, null, 2);
}
$('form').addEventListener('submit', async (event) => {
  event.preventDefault();
  if ($('submit').disabled) return;
  const payload = R.prepare({ stage: $('stage').value, text: $('answer').value.trim(), initialAnswer: $('initial').value, cardSpans: [] });
  const controls = [$('stage'), $('answer'), $('initial'), $('submit')]; controls.forEach((el) => { el.disabled = true; });
  $('status').textContent = '답안을 읽는 중…'; $('result').hidden = true;
  try {
    const response = await fetch('/api/m02/judge', { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8', 'X-Sciw-Local': 'm02' }, body: JSON.stringify({ action: 'judgeM02', ...payload }), signal: AbortSignal.timeout(65000) });
    const json = await response.json();
    if (!response.ok || !json.ok) throw new Error(json.code || 'EVALUATION_ERROR');
    const result = R.validate(payload, json.result.analysis);
    show(payload.text, { ...result, model: json.result.model }); $('status').textContent = '읽기 완료';
  } catch (error) { $('status').textContent = '평가를 완료하지 못했어요 (' + error.message + '). 답안은 유지돼요. 다시 제출해 주세요.'; }
  finally { controls.forEach((el) => { el.disabled = false; }); }
});
</script>
</html>
