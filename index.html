<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>서술 실험실</title>
<meta name="description" content="콧대 교수 앞에서 실험 결과가 무엇을 뜻하는지 증명하는 과학 서술 게임">
<!-- ?mission=m01 / ?mission=m02 로 들어오면 고르는 화면 없이 그 미션으로 바로 보낸다 (반 코드 등 나머지 주소 값은 그대로 넘김) -->
<script>
(function () {
  var paths = { m01: '감자 삼투/web/index.html', m02: '강철솜 질량 보존/web/index.html' };
  var q = new URLSearchParams(location.search), m = q.get('mission');
  if (paths[m]) { q.delete('mission'); var s = q.toString(); location.replace(encodeURI(paths[m]) + (s ? '?' + s : '') + location.hash); }
})();
</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap">
<link rel="preload" as="image" href="intro/lab-room.webp">
<style>
  :root {
    --ink: #2b2a28;
    --ink-soft: #6b6862;
    --board: #2f5446;
    --board-deep: #1f3a30;
    --board-edge: #8a6a45;
    --chalk: #f6f3ea;
    --chalk-soft: #c9d6cd;
    --memo: #fffdf8;
    --brass: #c99a3e;
    --glow: #ffd54a;
    --track-bg: #2d2b29;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
    color: var(--chalk);
    background: #1d1a17;
    min-height: 100vh;
    display: flex; flex-direction: column;
  }
  body::before {
    content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(ellipse at 50% 35%, rgba(20,28,24,.35), rgba(15,13,11,.82) 75%),
      linear-gradient(to bottom, rgba(0,0,0,.15), rgba(0,0,0,.55)),
      url('intro/lab-room.webp') center 30% / cover no-repeat;
  }
  .wrap { position: relative; z-index: 1; flex: 1; display: flex; flex-direction: column; align-items: center; padding: 40px 16px 28px; }

  /* 칠판 간판 */
  .sign {
    text-align: center; padding: 22px 40px 20px; border-radius: 10px;
    background: linear-gradient(160deg, var(--board), var(--board-deep));
    border: 8px solid var(--board-edge);
    box-shadow: 0 14px 40px rgba(0,0,0,.45), inset 0 0 40px rgba(0,0,0,.35);
    max-width: 560px; width: 100%;
  }
  .sign .brand { display: inline-flex; align-items: center; gap: 12px; }
  .sign svg { width: 30px; height: 38px; fill: none; stroke: var(--chalk); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .sign h1 { margin: 0; font-family: 'Gaegu', 'Pretendard', cursive; font-weight: 700; font-size: 46px; letter-spacing: 1px; line-height: 1; }
  .sign p { margin: 10px 0 0; font-family: 'Gaegu', 'Pretendard', cursive; font-size: 21px; color: var(--chalk-soft); }

  .prompt { margin: 34px 0 14px; font-size: 15px; font-weight: 700; letter-spacing: .5px; color: #e9e4da; text-shadow: 0 1px 4px rgba(0,0,0,.6); }

  /* 미션 카드: 고리에 매달린 열쇠고리 + 메모 카드 */
  .missions { display: grid; grid-template-columns: repeat(2, minmax(0, 300px)); gap: 32px; justify-content: center; width: 100%; }
  .mission {
    position: relative; display: flex; flex-direction: column; align-items: center;
    text-decoration: none; color: var(--ink);
    background: var(--memo); border-radius: 14px; padding: 18px 20px 20px;
    box-shadow: 0 10px 28px rgba(0,0,0,.4);
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .mission::before { /* 카드를 거는 핀 */
    content: ''; position: absolute; top: -9px; left: 50%; width: 18px; height: 18px; margin-left: -9px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #ffe7a3, var(--brass) 60%, #8a6420);
    box-shadow: 0 2px 4px rgba(0,0,0,.4);
  }
  .mission .art { height: 190px; width: 100%; display: flex; align-items: center; justify-content: center; margin-bottom: 6px; }
  /* 키링은 회색 실루엣만 보이고, 몸통 한가운데에 물음표를 띄운다 */
  .mission .key { position: relative; height: 100%; display: inline-block; transform-origin: 50% 0; transition: transform .4s ease; }
  .mission .key img { display: block; height: 100%; width: auto; filter: drop-shadow(0 6px 8px rgba(0,0,0,.18)); }
  .mission .qm {
    position: absolute; left: var(--qx, 50%); top: var(--qy, 65%); transform: translate(-50%, -50%);
    font-family: 'Gaegu', 'Pretendard', cursive; font-weight: 700; font-size: 74px; line-height: 1;
    color: #fffdf8; text-shadow: 0 2px 0 rgba(0,0,0,.18), 0 0 14px rgba(255,253,248,.35);
  }
  .mission .no { font-size: 13px; font-weight: 800; letter-spacing: 1.5px; color: var(--ink-soft); }
  .mission h2 { margin: 4px 0 12px; font-size: 23px; font-weight: 800; text-align: center; line-height: 1.25; }
  .mission .q {
    width: 100%; margin: 0 0 16px; padding: 10px 12px; border-radius: 8px;
    background: var(--board); color: var(--chalk); text-align: center;
    font-family: 'Gaegu', 'Pretendard', cursive; font-size: 19px; line-height: 1.25;
  }
  .mission .go {
    width: 100%; padding: 12px; border-radius: 10px; text-align: center;
    background: var(--track-bg); color: #fff; font-weight: 800; font-size: 16px;
  }
  .mission:hover, .mission:focus-visible { transform: translateY(-4px); box-shadow: 0 16px 36px rgba(0,0,0,.5); }
  .mission:hover .key, .mission:focus-visible .key { transform: rotate(-4deg); }
  .mission:hover .go, .mission:focus-visible .go { background: var(--board); }
  .mission:focus-visible { outline: 3px solid var(--glow); outline-offset: 4px; }

  footer { position: relative; z-index: 1; text-align: center; padding: 0 16px 26px; }
  footer a {
    display: inline-block; padding: 10px 18px; border-radius: 10px;
    border: 1px solid rgba(246,243,234,.4); color: var(--chalk); text-decoration: none; font-weight: 700; font-size: 14px;
    background: rgba(20,18,16,.45); backdrop-filter: blur(4px);
  }
  footer a:hover { background: rgba(47,84,70,.7); }
  footer a:focus-visible { outline: 3px solid var(--glow); outline-offset: 2px; }

  @media (max-width: 700px) {
    .wrap { padding-top: 24px; }
    .sign { padding: 16px 18px; border-width: 6px; }
    .sign h1 { font-size: 36px; }
    .sign p { font-size: 18px; }
    .prompt { margin-top: 24px; }
    .missions { grid-template-columns: minmax(0, 340px); gap: 26px; }
    .mission .art { height: 150px; }
    .mission .qm { font-size: 58px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .mission, .mission .key { transition: none; }
    .mission:hover, .mission:hover .key { transform: none; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header class="sign">
      <div class="brand">
        <svg viewBox="0 0 32 40" aria-hidden="true"><path d="M11 3h10m-8 0v13L3 33q-2 4 3 4h20q5 0 3-4L19 16V3M8 27h16"/></svg>
        <h1>서술 실험실</h1>
      </div>
      <p>콧대 교수를 설득할 수 있을까?</p>
    </header>

    <p class="prompt">도전할 미션을 고르세요</p>

    <nav class="missions" aria-label="미션 고르기">
      <a class="mission" data-path="감자 삼투/web/index.html" href="%EA%B0%90%EC%9E%90%20%EC%82%BC%ED%88%AC/web/index.html">
        <div class="art"><span class="key" style="--qx:55%;--qy:70%"><img src="intro/potato-silhouette.webp" alt="" width="504" height="520"><span class="qm" aria-hidden="true">?</span></span></div>
        <span class="no">MISSION 01</span>
        <h2>감자 속은 얼마나 진할까?</h2>
        <p class="q">감자 세포 안 용액의 농도는?</p>
        <span class="go">시작하기 →</span>
      </a>
      <a class="mission" data-path="강철솜 질량 보존/web/index.html" href="%EA%B0%95%EC%B2%A0%EC%86%9C%20%EC%A7%88%EB%9F%89%20%EB%B3%B4%EC%A1%B4/web/index.html">
        <div class="art"><span class="key" style="--qx:51%;--qy:64%"><img src="intro/steel-wool-silhouette.webp" alt="" width="388" height="520"><span class="qm" aria-hidden="true">?</span></span></div>
        <span class="no">MISSION 02</span>
        <h2>늘어난 강철솜</h2>
        <p class="q">강철솜이 무거워진 까닭은?</p>
        <span class="go">시작하기 →</span>
      </a>
    </nav>
  </div>

  <footer>
    <a href="teacher.html">선생님이신가요? 교사용 대시보드 예시 보기 →</a>
  </footer>

<script>
  // 반 코드처럼 이 주소에 붙어 온 값(?class=…)을 고른 미션에도 그대로 넘긴다
  if (location.search) {
    document.querySelectorAll('.mission[data-path]').forEach(function (a) {
      a.href = encodeURI(a.dataset.path) + location.search;
    });
  }
</script>
</body>
</html>
