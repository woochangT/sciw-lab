<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>서술 실험실 · 미션 04</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Share+Tech+Mono&display=swap">
  <link rel="stylesheet" href="../../강철솜 질량 보존/web/css/m02.css">
  <link rel="preload" as="image" href="../../강철솜 질량 보존/web/assets/laboratory-room.png">
  <link rel="preload" as="image" href="../../강철솜 질량 보존/web/assets/professor-expressions.png">
  <link rel="stylesheet" href="../../ui/class-entry.css?v=class-input-v2">
</head>
<body>
  <div class="screen" id="startScreen">
    <div class="start-layout">
      <div class="start-story">
        <div class="story-tag">관찰하고, 추리하고, 설명하는 과학 미션</div>
        <div class="story-heading">숫자 너머의<br><em>이유</em>를 찾아라.</div>
        <p>망치에 맞은 걸 느끼기도 전에 올라간 다리.<br>속도 기록이 뜻하는 바를 드러내어,<br>높은 콧대를 납작하게 꺾어 보세요.</p>
        <div class="start-dialogue"><div class="hero-quote">“반응 속도가<br>뭘 의미하지?”</div><div class="hero-prof professor-art" data-expression="skeptical" role="img" aria-label="콧대 교수"></div></div>
      </div>
      <form class="start-card" id="startForm" autocomplete="off">
        <div class="tag" id="startTag">미션 04</div>
        <h1 id="startTitle">먼저 올라간 다리</h1>
        <p class="start-intro">오늘의 미션을 해결할 연구원은 누구인가요?</p>
        <div class="class-entry-fields"><div><label for="grade">학년</label><input id="grade" type="text" inputmode="numeric" maxlength="2" pattern="[1-3]" placeholder="3" required></div><div><label for="classNo">반</label><input id="classNo" type="text" inputmode="numeric" maxlength="3" pattern="[1-9][0-9]?" placeholder="1" required></div></div>
        <label for="studentNo">출석번호</label>
        <input id="studentNo" inputmode="numeric" maxlength="3" placeholder="예: 12" required>
        <button class="go" type="submit" id="goBtn" disabled>실험실 들어가기</button>
        <div class="mode" id="setupStatus" role="status" hidden></div>
      </form>
    </div>
  </div>
  <script src="../../ui/class-entry.js?v=class-input-v2"></script>
  <script>
    SciwClassEntry.bindStart(function () {
      var status = document.getElementById('setupStatus');
      status.textContent = '아직 실험실 세팅 중';
      status.hidden = false;
    });
  </script>
</body>
</html>
